<svg width="1080" height="1350" viewBox="0 0 1080 1350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1080" y2="1350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBFCFB"/>
      <stop offset="0.58" stop-color="#F1F6F2"/>
      <stop offset="1" stop-color="#E7F1EB"/>
    </linearGradient>
    <linearGradient id="phoneBg" x1="650" y1="500" x2="1000" y2="1259" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20362F"/>
      <stop offset="0.46" stop-color="#315E50"/>
      <stop offset="1" stop-color="#DCEFE7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#15201E" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#15201E" flood-opacity="0.12"/>
    </filter>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif; }
      .smallCaps { letter-spacing: 3px; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <g opacity="0.22">
    <path d="M38 256C154 188 275 164 405 188C535 212 625 284 742 266C858 248 936 184 1030 194" stroke="#7DD8B8" stroke-width="2"/>
    <path d="M88 1038C214 1010 336 1028 462 1000C586 972 688 888 824 904C916 915 988 963 1040 1022" stroke="#8FB8E8" stroke-width="2"/>
  </g>

  <g transform="translate(80 74)">
    <path d="M24 42C24 20 42 2 64 2C86 2 104 20 104 42" stroke="#8AA181" stroke-width="16" stroke-linecap="round"/>
    <path d="M5 78C42 66 88 64 123 78" stroke="#8AA181" stroke-width="16" stroke-linecap="round"/>
    <text x="154" y="75" class="font" fill="#15201E" font-size="64" font-weight="700">Fina</text>
  </g>

  <text x="80" y="258" class="font smallCaps" fill="#2E9577" font-size="22" font-weight="700">Morning Brief</text>
  <text x="80" y="350" class="font" fill="#15201E" font-size="82" font-weight="700">Wake up to</text>
  <text x="80" y="438" class="font" fill="#15201E" font-size="82" font-weight="700">your money.</text>
  <text x="80" y="520" class="font" fill="#4F5853" font-size="34" font-weight="500">Before you open the app,</text>
  <text x="80" y="582" class="font" fill="#4F5853" font-size="30" font-weight="400">Fina sends a simple check-in:</text>
  <text x="80" y="624" class="font" fill="#4F5853" font-size="30" font-weight="400">what changed, what to watch,</text>
  <text x="80" y="666" class="font" fill="#4F5853" font-size="30" font-weight="400">and whether you are on track.</text>

  <g transform="translate(80 748)">
    <rect x="0" y="0" width="218" height="58" rx="29" fill="#15201E"/>
    <text x="109" y="38" text-anchor="middle" class="font" fill="#FFFFFF" font-size="22" font-weight="700">Daily forecast</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="630" y="480" width="390" height="799" rx="64" fill="#15201E"/>
    <rect x="650" y="500" width="350" height="759" rx="48" fill="url(#phoneBg)"/>
    <circle cx="705" cy="1075" r="156" fill="#7DD8B8" opacity="0.18"/>
    <circle cx="955" cy="560" r="92" fill="#8FB8E8" opacity="0.18"/>
    <circle cx="870" cy="1125" r="220" fill="#FBFCFB" opacity="0.16"/>

    <text x="825" y="650" text-anchor="middle" class="font" fill="#FFFFFF" font-size="78" font-weight="700">8:00</text>
    <text x="825" y="694" text-anchor="middle" class="font" fill="#FFFFFF" opacity="0.82" font-size="28" font-weight="500">Tuesday, June 23</text>

    <g filter="url(#cardShadow)">
      <rect x="682" y="750" width="286" height="222" rx="28" fill="#FFFFFF" fill-opacity="0.94"/>
      <g transform="translate(704 774)">
        <rect x="0" y="0" width="36" height="36" rx="10" fill="#E8F6F0"/>
        <path d="M9 22C16 17 23 17 30 22" stroke="#8AA181" stroke-width="4" stroke-linecap="round"/>
        <path d="M13 15C13 10 17 6 22 6C27 6 31 10 31 15" transform="translate(-4 1)" stroke="#8AA181" stroke-width="4" stroke-linecap="round"/>
        <text x="48" y="16" class="font" fill="#15201E" font-size="16" font-weight="700">Fina</text>
        <text x="238" y="16" text-anchor="end" class="font" fill="#6F7A76" font-size="13" font-weight="500">now</text>
        <text x="48" y="37" class="font" fill="#6F7A76" font-size="14" font-weight="500">Morning Brief</text>
      </g>
      <text x="704" y="855" class="font" fill="#15201E" font-size="19" font-weight="700">Good morning.</text>
      <text x="704" y="887" class="font" fill="#15201E" font-size="18" font-weight="400">Bills are covered today.</text>
      <text x="704" y="915" class="font" fill="#15201E" font-size="18" font-weight="400">Groceries are creeping up,</text>
      <text x="704" y="943" class="font" fill="#15201E" font-size="18" font-weight="400">so keep flex spend under $42.</text>
    </g>

    <text x="825" y="1024" text-anchor="middle" class="font" fill="#FFFFFF" opacity="0.72" font-size="18" font-weight="600">Tap to open Fina</text>
  </g>

  <text x="80" y="1276" class="font" fill="#6F7A76" font-size="24" font-weight="500">A daily check-in before the day starts.</text>
</svg>
