services:
  postgres:
    image: postgres:16-alpine
    container_name: fina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fina
      POSTGRES_PASSWORD: fina
      POSTGRES_DB: fina
    ports:
      - "5433:5432"
    volumes:
      - fina-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fina"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: fina
    command:
      - sh
      - -ec
      - >-
        psql -h postgres -U fina -d postgres -tAc
        "SELECT 1 FROM pg_database WHERE datname = 'fina_test'" | grep -qx 1 ||
        createdb -h postgres -U fina fina_test

volumes:
  fina-postgres:
